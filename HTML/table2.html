<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Slip Voucher</h1>
    
<table border="1" cellspacing="0" cellpadding="25">
<thead>
    <tr>
        <th>No.</th>
        <th>Item Name</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Amount</th>
    </tr>
</thead>
<tbody>
    <tr>
        <td>1</td>
        <td>Cookie</td>
        <td>5000 MMK</td>
        <td>3</td>
        <td>15000 MMK</td>
    </tr>
    <tr>
        <td>2</td>
        <td>Coffee</td>
        <td>4500 MMK</td>
        <td>2</td>
        <td>9000 MMK</td>
    </tr>
    <tr>
        <td>3</td>
        <td>Water</td>
        <td>1000 MMK</td>
        <td>2</td>
        <td>2000 MMK</td>
    </tr>
</tbody>
<tfoot>
    <tr>
        <th colspan="4" align="right">Total</th>
        <th>26000 MMK</th>
    </tr>
</tfoot>
</table>

<h1>Save Money</h1>

<table border="1" cellspacing="0" cellpadding="25">
    <thead>
        <tr>
            <th>Month</th>
            <th>Save Money</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>January</td>
            <td>150,000</td>
            <td rowspan="3">200,000</td>
        </tr>
        <tr>
            <td>February</td>
            <td>50,000</td>
        </tr>
        <tr>
            <td>March</td>
            <td>100,000</td>
        </tr>
    </tbody>
</table>

</body>
</html>
