<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello HTML</h1>

    <!-- tag -->
    <p></p>

    <!-- Element -->
    <p>Hello</p>
    <div>
        <h2>Hi</h2>
    </div>

    <!-- Attribute -->
     <!-- key = "value" -->
    <p align="right">This is p element 1</p>
    <p align="center">This is p element 2</p>
    <p align="left">This is p element 3</p>

    <!-- Global Attribute
     class and id
     class -> အုပ်စုဖွဲ့ချင်တဲ့အခါမှာသုံး
     id -> Unique ဖြစ်ချင်တဲ့အခါမှာသုံး
    -->
<p class="p-text p-element p-tag" id="p4">This is p element 4</p>
<p class="p-text" id="p5">This is p element 5</p>

<!-- Insensitive Code -->
<h1>Hello</h1>
<H1>Hi</H1>

<!-- White space တွေကို html မှာ Ignore လုပ်တာကို စမ်းထားတာ -->
<p>Hello my         student.</p>

<!-- Ugly Code -->
<div><div><h1>Title 1</h1><p>This is paragraph</p></div><div><h1>Title 2</h1><p>This is paragraph</p></div></div>

<!-- Pretty Code -->
<div>
    <div>
        <h1>Title 1</h1>
        <p>This is paragraph</p>
    </div>
    <div>
        <h1>Title 2</h1>
        <p>This is paragraph</p>
    </div>
</div>


</body>
</html>
