<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Responsive Website ဖြစ်ဖို့အတွက် View Port နဲ့ Width တွေက အရေးကြီးတယ် -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroToOne Tech - One stop digital solution</title>
    <meta name="keywords" content="Software house myanmar, website services myanmar, One stop digital solution">
   <!-- SEO ကောင်းဖို့အတွက် Description ကို လိုအပ်တယ် -->
    <meta name="description" content="We services customized software services and customize website and web application services.">
    <meta name="robots" content="index, nofollow">



   <!-- Internal CSS ကို head tag ထဲမှာပဲ ရေးရမယ် Style tag အဖွင့်အပိတ်ထဲမှာ ရေးရမယ်
    -->
    <!-- Internal CSS -->
     <!-- selector {
      property value;
      } -->

<style>
    h1{
        color: red;
    }

.tag-line{
    color: yellowgreen;
}
</style>


<!-- External CSS 
css နဲ့ ဆုံးတဲ့ ဖိုင်တွေကို link ချိတ်ပြီး သုံးတဲ့နေရာမှာ external css ကို သုံးတယ် 
-->

 <link rel="stylesheet" href="style.css">

<!-- JavaScript Code တွေက Head tag ထဲမှာ မရေးလည်းရတယ် -->

 <!-- JavaScript -->

  <script>
    alert("Hello");
  </script>

</head>
<body>
    <h1>Head Lesson</h1>
    <p class="tag-line">Learn with practice. Practice make perfect</p>

</body>
</html>
